<!DOCTYPE html>
<html>
	<body>
		<form id="form" class="homey-form">
			<header class="homey-header">
				<h1 class="homey-title" data-i18n="pair.email_verification.title"></h1>
				<p class="homey-subtitle" data-i18n="pair.email_verification.subtitle"></p>
			</header>

			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="pair.email_verification.legend"></legend>

				<div class="homey-form-group">
					<label class="homey-form-label" for="email" data-i18n="pair.email_verification.email"></label>
					<input
						id="email"
						class="homey-form-input"
						type="text"
						inputmode="email"
						autocomplete="email"
					/>
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="name" data-i18n="pair.email_verification.name"></label>
					<input id="name" class="homey-form-input" type="text" maxlength="64" />
				</div>
			</fieldset>

			<div class="homey-form-group">
				<button
					id="submit"
					type="submit"
					class="homey-button-primary-full"
					data-i18n="pair.email_verification.submit"
				></button>
			</div>
		</form>

		<script type="application/javascript">
			const form = document.getElementById("form");
			const emailInput = document.getElementById("email");
			const nameInput = document.getElementById("name");
			const submit = document.getElementById("submit");

			nameInput.placeholder = Homey.__(
				"pair.email_verification.name_placeholder",
			);

			Homey.emit("get_login").then((login) => {
				emailInput.value = login.email;
				nameInput.value = login.name;
			});

			form.addEventListener("submit", async (event) => {
				event.preventDefault();

				const email = emailInput.value.trim();
				const name = nameInput.value.trim();

				if (!email) {
					Homey.alert(Homey.__("pair.email_verification.error.missing_email"));
					return;
				}

				submit.disabled = true;
				submit.classList.add("is-loading");

				try {
					await Homey.emit("submit_email", { email, name });
				} catch (error) {
					Homey.alert(error?.message ?? String(error));
				} finally {
					submit.disabled = false;
					submit.classList.remove("is-loading");
				}
			});
		</script>
	</body>
</html>
